name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Drift/Riverpod/freezed codegen isn't committed (see .gitignore) - regenerate it before
      # analyzing/testing, or nothing in lib/ compiles on a fresh checkout.
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze
      - run: flutter test --coverage

      - run: dart pub get
        working-directory: packages/rules_engine
      - run: dart analyze
        working-directory: packages/rules_engine
      - run: dart test --coverage=coverage
        working-directory: packages/rules_engine

      # SonarCloud wants LCOV files with paths relative to the repository root: format the
      # engine's raw coverage, then prefix its paths with the package folder.
      - name: Write the engine LCOV report
        working-directory: packages/rules_engine
        run: |
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=.dart_tool/package_config.json --base-directory=.
          sed -i 's#^SF:#SF:packages/rules_engine/#' coverage/lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            packages/rules_engine/coverage/lcov.info
          if-no-files-found: error

  # SonarCloud analysis, once the tests have produced their coverage. No stored token: the job
  # trades its GitHub OIDC identity for a short-lived Sonar token (secretless analysis, which
  # must be enabled in the SonarCloud organization settings). Skipped for pull requests from
  # forks, which don't get an OIDC token either.
  sonar:
    name: SonarCloud analysis
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # lets the job request a GitHub OIDC token
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history so SonarCloud can compute blame and what counts as new code.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Check the coverage reports are where the scan expects them
        run: |
          test -s coverage/lcov.info
          test -s packages/rules_engine/coverage/lcov.info

      # Exports the short-lived token as SONAR_TOKEN for the scan below, and outputs the
      # organization and project key of the SonarCloud project bound to this repository.
      - name: Authenticate with SonarCloud
        id: auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}
