# SonarCloud project configuration
# Documentation: https://docs.sonarcloud.io

# The organization and the project key are not set here: the workflow passes them from the
# SonarCloud project bound to this repository (see the sonar job in tests.yml).
sonar.projectName=Loup Garou MJ

# -- Sources ------------------------------------------------------------------

# The Flutter app and the pure-Dart rules engine package.
sonar.sources=lib,packages/rules_engine/lib
sonar.tests=test,packages/rules_engine/test

# -- Coverage (LCOV) ----------------------------------------------------------

# Written by the Tests workflow: `flutter test --coverage` for the app and
# `dart test --coverage` + format_coverage for the engine (paths rewritten to start
# from the repository root). The scan reports 0% if one of these files is missing.
sonar.dart.lcov.reportPaths=coverage/lcov.info,packages/rules_engine/coverage/lcov.info

# -- Exclusions ---------------------------------------------------------------

# Generated by build_runner in CI (Drift, Riverpod, freezed); not hand-written code.
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart

sonar.coverage.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart
