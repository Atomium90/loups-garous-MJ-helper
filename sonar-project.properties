# SonarCloud project configuration
# Documentation: https://docs.sonarcloud.io

# The organization and the project key are not set here: the workflow passes them from the
# SonarCloud project bound to this repository (see the sonar job in tests.yml).
sonar.projectName=Loup Garou MJ

# -- Coverage (LCOV) ----------------------------------------------------------

# Written by the Tests workflow: `flutter test --coverage` for the app and
# `dart test --coverage` + format_coverage for the engine (paths rewritten to start
# from the repository root). The scan reports 0% if one of these files is missing.
sonar.dart.lcov.reportPaths=coverage/lcov.info,packages/rules_engine/coverage/lcov.info

# -- Duplication --------------------------------------------------------------

# The French and English message files have the same keys by design.
sonar.cpd.exclusions=lib/l10n/**

# -- Exclusions ---------------------------------------------------------------

# SonarCloud analyzes the whole repository by default, so leave out what is not ours to review:
# the tests (long runs of taps and expectations repeat by nature, and they are not held to the
# coverage of production code), generated code (Drift, Riverpod, freezed, produced by
# build_runner in CI), the committed Drift schema snapshots, the Flutter platform scaffolding
# and binary assets. The tests still produce the coverage report of the production code.
sonar.exclusions=\
  test/**,\
  packages/rules_engine/test/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  lib/l10n/generated/**,\
  drift_schemas/**,\
  android/**,\
  ios/**,\
  **/*.png

sonar.coverage.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  lib/l10n/generated/**
